name: Build and release
on:
  push:
    branches: [main]
    tags: ['v7.4.33-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: PHP 7.4 / ${{ matrix.target }} / amd64
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        target: [ubuntu16.04, ubuntu18.04, debian10]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify source provenance
        run: python3 scripts/verify-origin.py
      - name: Build and test in disposable target containers
        env:
          TARGET: ${{ matrix.target }}
          JOBS: '4'
        run: python3 scripts/run.py "$TARGET"
      - name: Save packages and test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: php7-${{ matrix.target }}-amd64
          path: out/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish verified release
    if: startsWith(github.ref, 'refs/tags/') && github.repository == 'Niek/php7'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: php7-*-amd64
          path: artifacts
      - name: Assemble and check release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release.py
      - name: Attest release archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/*.tar.xz
            release/*.deb
      - name: Upload all assets, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > /tmp/release.json 2>/dev/null; then
            python3 -c 'import json; assert json.load(open("/tmp/release.json"))["isDraft"], "Refusing to change a published release"'
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "PHP 7.4.33 security backports ($RELEASE_TAG)" --notes-file RELEASE.md
          fi
          gh release upload "$RELEASE_TAG" release/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false
